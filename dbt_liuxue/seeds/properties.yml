version: 2
seeds:
  - name: dim_uk_university
    columns:
      - name: uk_uni_id
        tests: [unique, not_null]
  - name: dim_major_mapping
    columns:
      - name: fit_level
        tests:
          - accepted_values:
              arguments:
                values: ['对口', '可转', '不可转']
  - name: dim_cn_university
    columns:
      - name: cn_uni_id
        tests: [unique, not_null]
      - name: tier_label
        tests:
          - accepted_values:
              arguments:
                values: ['985', '211', '双一流', '双非', '海本', '其他']
  - name: cn_university_alias
    columns:
      - name: alias
        tests: [unique, not_null]
  - name: testdaily_lines_seed
    description: TestDaily聚合的英国大学对中国院校分数线种子数据
    columns:
      - name: uk_uni_id
        tests: [not_null]
      - name: min_avg_score
        tests: [not_null]
      - name: source_type
        tests:
          - accepted_values:
              arguments:
                values: ['official_web', 'official_pdf', 'aggregator']
