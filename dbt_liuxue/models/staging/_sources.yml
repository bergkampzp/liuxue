version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: gradcafe_admissions
        description: GradCafe 录取案例原始数据
        columns:
          - name: id
          - name: school
            description: 学校名称
          - name: program
            description: 专业名称
          - name: degree
            description: 学位 (PhD/Masters/Bachelors)
          - name: gpa
            description: GPA (0-4.0)
          - name: gre_q
            description: GRE Quantitative
          - name: gre_v
            description: GRE Verbal
          - name: decision
            description: 录取结果
          - name: source_url
            description: 来源 URL
      - name: liuxue_admissions
        description: 一亩三分地+寄托 中文站录取案例（英联邦反推核心源）
        columns:
          - name: school
          - name: program
          - name: degree
          - name: decision
          - name: decision_detail
          - name: gpa
          - name: ielts
          - name: ielts_l
          - name: ielts_r
          - name: ielts_w
          - name: ielts_s
          - name: undergrad_school
          - name: undergrad_major
          - name: country
          - name: source
          - name: source_url
      - name: uk_ielts_requirements
        description: 英国大学雅思要求（官方采集）
      - name: uk_official_lists
        description: 英国大学官方中国院校认可名单（UCL/Bristol/Edinburgh/Sheffield四源）
        columns:
          - name: id
          - name: uk_uni_id
          - name: cn_name_raw
          - name: band
          - name: min_avg_score
          - name: source_url
          - name: fetched_at
      - name: case_school_map
        description: 案例中本科院校原始名 → cn_uni_id 归一映射表（三级匹配，92高闸）
        columns:
          - name: undergrad_school_raw
            description: 原始本科院校名（PK）
          - name: cn_uni_id
            description: 归一后国内院校ID，NULL=待人工复核
          - name: method
            description: 匹配方式 exact/alias/fuzzy
          - name: confidence
            description: 匹配置信度 0-1
          - name: reviewed
            description: 是否已人工复核
      - name: uk_entry_line_case
        description: 反推线结果表（按 uk_uni_id×subject_group×cn_tier 分组）
        columns:
          - name: uk_uni_id
          - name: subject_group
          - name: cn_tier
          - name: line_low
          - name: line_high
          - name: line_iso50
          - name: sample_n
          - name: offer_n
          - name: reject_n
          - name: confidence
          - name: method
          - name: fallback_level
          - name: year_range
          - name: note
