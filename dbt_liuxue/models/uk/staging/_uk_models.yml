version: 2
models:
  - name: stg_uk_ielts_requirements
    columns:
      - name: ielts_overall
        tests: [not_null]
      - name: source_url
        tests:
          - not_null

  - name: stg_uk_official_lists
    description: 官方认可名单归一化（cn_name_raw → cn_uni_id），未命中行保留NULL
    columns:
      - name: uk_uni_id
        tests: [not_null]
      - name: cn_name_raw
        tests: [not_null]
      - name: band
        tests: [not_null]

  - name: entry_requirement
    description: 统一选校定位分数线（官方优先 > TestDaily种子）
    columns:
      - name: min_avg_score
        tests: [not_null]
      - name: source_type
        tests:
          - accepted_values:
              arguments:
                values: ['official_web', 'official_pdf', 'aggregator']
      - name: confidence
        tests:
          - accepted_values:
              arguments:
                values: ['high', 'medium', 'low']

  - name: mart_uk_school_match_v1
    description: 选校定位查表层（tier 级聚合，保守上限）+ 基线雅思
    columns:
      - name: min_avg_score
        tests: [not_null]
      - name: cn_tier
        tests: [not_null]

  - name: stg_uk_cases
    description: 英联邦案例暂存层（school 精确命中 dim_uk_university，avg_score_pct 归一）
    columns:
      - name: id
        tests: [not_null, unique]
      - name: uk_uni_id
        tests: [not_null]
      - name: decision
        tests:
          - accepted_values:
              arguments:
                values: ['Offer', 'Rejected', 'Waitlist', 'Conditional Offer', 'Interview']

  - name: int_uk_cases_tagged
    description: 英联邦案例行级标注（tier_label + subject_group，供反推拟合脚本读取）
    columns:
      - name: id
        tests: [not_null]
      - name: uk_uni_id
        tests: [not_null]
      - name: tier_label
        tests:
          - accepted_values:
              arguments:
                values: ['985', '211', '双非', '海本', '其他']
      - name: subject_group
        tests:
          - accepted_values:
              arguments:
                values: ['CS与数据', '商科金融', '工科', '法律', '教育', '传媒', '通用']
